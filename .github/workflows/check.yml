name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code

      - name: Typecheck and fast tests
        run: npm run check:fast

      - name: Generated plugins match the build
        run: npm run check:plugin

      - name: Claude Code plugin validation
        run: |
          claude plugin validate --strict ./plugins/claude/paved
          claude plugin validate .

      - name: OpenAI directory package
        run: npm run package:openai

      - uses: actions/upload-artifact@v4
        with:
          name: paved-openai
          path: dist/*.zip
          if-no-files-found: error
