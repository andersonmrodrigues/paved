name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: minor
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pull-request:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare the release
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
        run: echo "version=$(./release-prepare.sh "$BUMP")" >> "$GITHUB_OUTPUT"

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "feat: release v$VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "feat: release v$VERSION" \
            --body "Bumps the Core to $VERSION, ships the \`[Unreleased]\` changelog entries under it and rebuilds the plugin. Merging tags \`v$VERSION\`."
          # Pull requests opened with GITHUB_TOKEN trigger no pull_request workflows;
          # a dispatched run reports the check on the same commit.
          gh workflow run check.yml --ref "$branch"

  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag the released version
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists."
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
