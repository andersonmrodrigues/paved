<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">How Paved Core works</title>
  <desc id="desc">The human asks an agent. The generated plugin launches a pinned runtime. That runtime resolves Core, adapters and project state, then runs a workflow through skills, tools, verification and evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1d1d"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1d1d; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 14px; fill: #5c5c5c; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .small { font-size: 12px; fill: #3d3d3d; }
      .box { stroke-width: 2; }
    </style>
  </defs>
  <rect width="1280" height="860" fill="#f8f7f3"/>

  <text class="title" x="40" y="48">How Paved Core works</text>
  <text class="sub" x="40" y="74">Universal contracts resolve with adapters and project state. The plugin only launches a pinned runtime.</text>

  <rect class="box" x="40" y="104" width="200" height="88" rx="12" fill="#fff3d4" stroke="#f8a23a"/>
  <text class="h" x="140" y="140" text-anchor="middle">Human</text>
  <text class="b" x="140" y="162" text-anchor="middle">owns choices and</text>
  <text class="b" x="140" y="180" text-anchor="middle">approvals</text>

  <rect class="box" x="300" y="104" width="240" height="88" rx="12" fill="#f3e8ff" stroke="#9b6ad6"/>
  <text class="h" x="420" y="140" text-anchor="middle">Agent</text>
  <text class="b" x="420" y="162" text-anchor="middle">Codex / Claude Code</text>
  <text class="b" x="420" y="180" text-anchor="middle">explains, does not decide</text>

  <rect class="box" x="600" y="104" width="280" height="88" rx="12" fill="#e4ecff" stroke="#4262ff"/>
  <text class="h" x="740" y="136" text-anchor="middle">Generated plugin</text>
  <text class="b" x="740" y="158" text-anchor="middle">skills, launcher,</text>
  <text class="b" x="740" y="176" text-anchor="middle">pinned paved-core.tgz</text>

  <rect class="box" x="940" y="104" width="300" height="88" rx="12" fill="#e4ecff" stroke="#4262ff"/>
  <text class="h" x="1090" y="136" text-anchor="middle">Pinned runtime</text>
  <text class="b" x="1090" y="158" text-anchor="middle">.paved/runtime/</text>
  <text class="b" x="1090" y="176" text-anchor="middle">CLI: workflows, tools, verify</text>

  <line x1="240" y1="148" x2="300" y2="148" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="270" y="140" text-anchor="middle">task</text>
  <line x1="540" y1="148" x2="600" y2="148" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="570" y="140" text-anchor="middle">cmd</text>
  <line x1="880" y1="148" x2="940" y2="148" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="910" y="140" text-anchor="middle">launch</text>

  <text class="h" x="40" y="240">What the runtime resolves (nothing in Core points at a consumer)</text>

  <rect class="box" x="40" y="260" width="360" height="300" rx="14" fill="#e4ecff" stroke="#4262ff"/>
  <text class="h" x="220" y="292" text-anchor="middle">Core release (versioned)</text>
  <text class="b" x="60" y="328">- schemas (contracts)</text>
  <text class="b" x="60" y="350">- instructions and AGENTS.md</text>
  <text class="b" x="60" y="372">- skills (how)</text>
  <text class="b" x="60" y="394">- workflows (phases + gates)</text>
  <text class="b" x="60" y="416">- rules (constraints)</text>
  <text class="b" x="60" y="438">- tools + implementations</text>
  <text class="b" x="60" y="460">- verification model</text>
  <text class="b" x="60" y="482">- generator contracts</text>
  <text class="small" x="60" y="520">True for every well-built repository</text>

  <rect class="box" x="440" y="260" width="280" height="300" rx="14" fill="#e8f4ff" stroke="#6ea8fe"/>
  <text class="h" x="580" y="292" text-anchor="middle">Adapters</text>
  <text class="b" x="580" y="316" text-anchor="middle">(own versions)</text>
  <text class="b" x="580" y="356" text-anchor="middle">Java, TypeScript</text>
  <text class="b" x="580" y="378" text-anchor="middle">Angular, Flutter</text>
  <text class="b" x="580" y="400" text-anchor="middle">Quarkus, Dart</text>
  <text class="b" x="580" y="422" text-anchor="middle">PostgreSQL, Git</text>
  <text class="small" x="580" y="468" text-anchor="middle">Stack knowledge.</text>
  <text class="small" x="580" y="488" text-anchor="middle">Never project facts.</text>

  <rect class="box" x="760" y="260" width="480" height="300" rx="14" fill="#e3f6e8" stroke="#3d9c4f"/>
  <text class="h" x="1000" y="292" text-anchor="middle">Consumer .paved/</text>
  <text class="b" x="780" y="328">Human-owned: manifest, rules,</text>
  <text class="b" x="780" y="350">verification profile, tools, overrides</text>
  <text class="b" x="780" y="384">Generated-reviewed: project context</text>
  <text class="b" x="780" y="418">Disposable: generated/ runs, evidence</text>
  <text class="b" x="780" y="452">Lock pins Core + adapters + runtime</text>
  <text class="small" x="780" y="520">Overrides reference Core/adapter content; they never copy it.</text>

  <line x1="1090" y1="192" x2="1090" y2="250" stroke="#1d1d1d" stroke-width="2"/>
  <line x1="220" y1="250" x2="1090" y2="250" stroke="#1d1d1d" stroke-width="2"/>
  <line x1="220" y1="250" x2="220" y2="260" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="250" x2="580" y2="260" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="250" x2="1000" y2="260" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="h" x="40" y="604">One development task</text>

  <rect class="box" x="40" y="624" width="180" height="100" rx="12" fill="#f3e8ff" stroke="#9b6ad6"/>
  <text class="h" x="130" y="664" text-anchor="middle">Workflow</text>
  <text class="b" x="130" y="688" text-anchor="middle">feature / bug /</text>
  <text class="b" x="130" y="706" text-anchor="middle">refactor</text>

  <rect class="box" x="280" y="624" width="180" height="100" rx="12" fill="#f3e8ff" stroke="#9b6ad6"/>
  <text class="h" x="370" y="664" text-anchor="middle">Skills</text>
  <text class="b" x="370" y="688" text-anchor="middle">procedure per</text>
  <text class="b" x="370" y="706" text-anchor="middle">kind of work</text>

  <rect class="box" x="520" y="624" width="200" height="100" rx="12" fill="#e4ecff" stroke="#4262ff"/>
  <text class="h" x="620" y="664" text-anchor="middle">Tools</text>
  <text class="b" x="620" y="688" text-anchor="middle">capability + safety</text>
  <text class="b" x="620" y="706" text-anchor="middle">+ binding</text>

  <rect class="box" x="780" y="624" width="200" height="100" rx="12" fill="#fff3d4" stroke="#f8a23a"/>
  <text class="h" x="880" y="664" text-anchor="middle">Verification</text>
  <text class="b" x="880" y="688" text-anchor="middle">profile checks</text>
  <text class="b" x="880" y="706" text-anchor="middle">vs claims</text>

  <rect class="box" x="1040" y="624" width="200" height="100" rx="12" fill="#e3f6e8" stroke="#3d9c4f"/>
  <text class="h" x="1140" y="664" text-anchor="middle">Evidence</text>
  <text class="b" x="1140" y="688" text-anchor="middle">observed results</text>
  <text class="b" x="1140" y="706" text-anchor="middle">+ revision</text>

  <line x1="220" y1="674" x2="280" y2="674" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="674" x2="520" y2="674" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="674" x2="780" y2="674" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="674" x2="1040" y2="674" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect class="box" x="40" y="760" width="1200" height="72" rx="12" fill="#ffffff" stroke="#b8b8b8"/>
  <text class="b" x="640" y="792" text-anchor="middle">Plugin is not the source of truth. Missing evidence is a blocker, not a question. Completion requires matching checks and a recorded diff.</text>
  <text class="small" x="640" y="814" text-anchor="middle">Human chooses. Paved derives what evidence supports. The agent explains and relays.</text>
</svg>
