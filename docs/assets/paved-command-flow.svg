<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" role="img" aria-labelledby="title desc">
  <title id="title">How to use Paved commands in development</title>
  <desc id="desc">Paved v3 defaults to direct task work: request, change, verify and report. The optional intent, plan and execute workflow is used only when requested or required by project policy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1d1d"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1d1d; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 14px; fill: #5c5c5c; }
      .h { font-size: 15px; font-weight: 700; }
      .lane { font-size: 16px; font-weight: 700; }
      .b { font-size: 13px; }
      .small { font-size: 12px; fill: #3d3d3d; }
      .box { stroke-width: 2; }
    </style>
  </defs>
  <rect width="1360" height="800" fill="#f8f7f3"/>

  <text class="title" x="40" y="44">Paved v3: direct work by default</text>
  <text class="sub" x="40" y="70">Give the agent the outcome. Paved supplies repository context, rules and verification; the host agent keeps its own tool permissions.</text>

  <text class="lane" x="40" y="110">1. Setup (once per repository)</text>

  <rect class="box" x="40" y="128" width="240" height="96" rx="24" fill="#e4ecff" stroke="#4262ff"/>
  <text class="h" x="160" y="164" text-anchor="middle">init</text>
  <text class="b" x="160" y="186" text-anchor="middle">bootstrap .paved/, pin runtime</text>
  <text class="b" x="160" y="204" text-anchor="middle">asks checks, test tool, rules</text>

  <rect class="box" x="340" y="128" width="300" height="96" rx="12" fill="#e3f6e8" stroke="#3d9c4f"/>
  <text class="h" x="490" y="164" text-anchor="middle">status</text>
  <text class="b" x="490" y="186" text-anchor="middle">lifecycle, open runs, diagnostics</text>
  <text class="b" x="490" y="204" text-anchor="middle">repairs only after your answer</text>

  <rect class="box" x="700" y="128" width="280" height="96" rx="12" fill="#f3f3f3" stroke="#8a8a8a"/>
  <text class="h" x="840" y="164" text-anchor="middle">update</text>
  <text class="b" x="840" y="186" text-anchor="middle">Core and adapters, atomic swap</text>
  <text class="b" x="840" y="204" text-anchor="middle">refreshes the AGENTS.md block</text>

  <line x1="280" y1="176" x2="336" y2="176" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="176" x2="696" y2="176" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="1010" y="170">init never resets an existing .paved/.</text>
  <text class="small" x="1010" y="188">update is optional.</text>

  <text class="lane" x="40" y="280">2. Default path: request, change, verify, report</text>

  <rect class="box" x="40" y="300" width="360" height="145" rx="12" fill="#e4ecff" stroke="#4262ff"/>
  <text class="h" x="220" y="336" text-anchor="middle">Request</text>
  <text class="b" x="220" y="362" text-anchor="middle">Describe the outcome you want</text>
  <text class="b" x="220" y="384" text-anchor="middle">Agent reads relevant context and rules</text>
  <text class="small" x="220" y="416" text-anchor="middle">No mandatory run or plan approval</text>

  <rect class="box" x="500" y="300" width="360" height="145" rx="12" fill="#f3e8ff" stroke="#8d4bd6"/>
  <text class="h" x="680" y="336" text-anchor="middle">Change</text>
  <text class="b" x="680" y="362" text-anchor="middle">Make the smallest useful change</text>
  <text class="b" x="680" y="384" text-anchor="middle">Follow applicable project constraints</text>
  <text class="small" x="680" y="416" text-anchor="middle">Use paved task for a durable handoff</text>

  <rect class="box" x="960" y="300" width="360" height="145" rx="12" fill="#e3f6e8" stroke="#3d9c4f"/>
  <text class="h" x="1140" y="336" text-anchor="middle">Verify and report</text>
  <text class="b" x="1140" y="362" text-anchor="middle">Run applicable declared checks</text>
  <text class="b" x="1140" y="384" text-anchor="middle">Report observed results and explain gaps</text>
  <text class="small" x="1140" y="416" text-anchor="middle">Use paved verify --changed when initialized</text>

  <line x1="400" y1="372" x2="496" y2="372" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="372" x2="956" y2="372" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="lane" x="40" y="510">3. Optional: governed workflow (only when requested or required by policy)</text>

  <rect class="box" x="40" y="530" width="400" height="130" rx="12" fill="#e4ecff" stroke="#4262ff"/>
  <text class="h" x="240" y="564" text-anchor="middle">intent</text>
  <text class="b" x="240" y="588" text-anchor="middle">Classify the request, gather context</text>
  <text class="b" x="240" y="610" text-anchor="middle">and discover relevant implementation</text>

  <rect class="box" x="480" y="530" width="400" height="130" rx="12" fill="#fff3d4" stroke="#f8a23a"/>
  <text class="h" x="680" y="564" text-anchor="middle">plan</text>
  <text class="b" x="680" y="588" text-anchor="middle">Write the plan for human review</text>
  <text class="b" x="680" y="610" text-anchor="middle">Approval is required before execution</text>

  <rect class="box" x="920" y="530" width="400" height="130" rx="12" fill="#f3e8ff" stroke="#8d4bd6"/>
  <text class="h" x="1120" y="564" text-anchor="middle">execute</text>
  <text class="b" x="1120" y="588" text-anchor="middle">Implement, validate and verify</text>
  <text class="b" x="1120" y="610" text-anchor="middle">Record evidence and required review</text>

  <line x1="440" y1="595" x2="476" y2="595" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="595" x2="916" y2="595" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect class="box" x="40" y="692" width="1280" height="62" rx="10" fill="#ffffff" stroke="#8a8a8a"/>
  <text class="b" x="680" y="718" text-anchor="middle">Investigations remain read-only. Plan approval applies to governed workflows, not ordinary direct work.</text>
  <text class="small" x="680" y="738" text-anchor="middle">Paved records evidence it observes; the host agent controls its own tool permissions.</text>
</svg>
