<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 980" role="img" aria-labelledby="title desc">
  <title id="title">How to use Paved commands in development</title>
  <desc id="desc">Setup with init and status, then feature, fix or refactor as durable runs, or the same phases as plan, implement, test, verify and review. Completion needs evidence. Gardener only proposes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1d1d"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1d1d; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 14px; fill: #5c5c5c; }
      .h { font-size: 15px; font-weight: 700; }
      .lane { font-size: 16px; font-weight: 700; }
      .b { font-size: 13px; }
      .small { font-size: 12px; fill: #3d3d3d; }
      .box { stroke-width: 2; }
    </style>
  </defs>
  <rect width="1360" height="980" fill="#f8f7f3"/>

  <text class="title" x="40" y="44">How to use Paved commands in development</text>
  <text class="sub" x="40" y="70">Same contract as paved.name. Claude: /paved:name. Codex: paved:name. Resume with --run id --advance. Humans answer with --answer.</text>

  <text class="lane" x="40" y="110">1. Setup (once per repository)</text>

  <rect class="box" x="40" y="128" width="200" height="96" rx="24" fill="#e4ecff" stroke="#4262ff"/>
  <text class="h" x="140" y="164" text-anchor="middle">init</text>
  <text class="b" x="140" y="186" text-anchor="middle">bootstrap .paved/</text>
  <text class="b" x="140" y="204" text-anchor="middle">pin runtime</text>

  <rect class="box" x="300" y="128" width="240" height="96" rx="12" fill="#fff3d4" stroke="#f8a23a"/>
  <text class="h" x="420" y="164" text-anchor="middle">Human decisions</text>
  <text class="b" x="420" y="186" text-anchor="middle">verification gates</text>
  <text class="b" x="420" y="204" text-anchor="middle">rules / test tool</text>

  <rect class="box" x="600" y="128" width="220" height="96" rx="12" fill="#e3f6e8" stroke="#3d9c4f"/>
  <text class="h" x="710" y="164" text-anchor="middle">status</text>
  <text class="b" x="710" y="186" text-anchor="middle">lifecycle until</text>
  <text class="b" x="710" y="204" text-anchor="middle">READY</text>

  <rect class="box" x="900" y="128" width="200" height="96" rx="12" fill="#f3f3f3" stroke="#8a8a8a"/>
  <text class="h" x="1000" y="164" text-anchor="middle">doctor</text>
  <text class="b" x="1000" y="186" text-anchor="middle">if diagnostics block</text>
  <text class="b" x="1000" y="204" text-anchor="middle">READY (approval first)</text>

  <rect class="box" x="1140" y="128" width="180" height="96" rx="12" fill="#f3f3f3" stroke="#8a8a8a"/>
  <text class="h" x="1230" y="164" text-anchor="middle">update</text>
  <text class="b" x="1230" y="186" text-anchor="middle">when Core / adapters</text>
  <text class="b" x="1230" y="204" text-anchor="middle">move (atomic swap)</text>

  <line x1="240" y1="176" x2="300" y2="176" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="270" y="168" text-anchor="middle">awaiting_input</text>
  <line x1="540" y1="176" x2="600" y2="176" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="176" x2="900" y2="176" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="1100" y1="176" x2="1140" y2="176" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text class="small" x="40" y="248">doctor and update are optional. init never resets an existing .paved/ directory.</text>

  <text class="lane" x="40" y="286">2. Choose a change type (durable run under .paved/generated/runs/)</text>

  <rect class="box" x="40" y="306" width="300" height="120" rx="12" fill="#e4ecff" stroke="#4262ff"/>
  <text class="h" x="190" y="342" text-anchor="middle">feature &lt;request&gt;</text>
  <text class="b" x="190" y="366" text-anchor="middle">new or changed behavior</text>
  <text class="b" x="190" y="386" text-anchor="middle">composes plan -&gt; implement</text>
  <text class="b" x="190" y="406" text-anchor="middle">-&gt; test -&gt; verify -&gt; review</text>

  <rect class="box" x="370" y="306" width="300" height="120" rx="12" fill="#fff3d4" stroke="#f8a23a"/>
  <text class="h" x="520" y="342" text-anchor="middle">fix &lt;report&gt;</text>
  <text class="b" x="520" y="366" text-anchor="middle">observed failure</text>
  <text class="b" x="520" y="386" text-anchor="middle">reproduce -&gt; diagnose -&gt; fix</text>
  <text class="b" x="520" y="406" text-anchor="middle">-&gt; regression -&gt; verify</text>

  <rect class="box" x="700" y="306" width="300" height="120" rx="12" fill="#f3e8ff" stroke="#9b6ad6"/>
  <text class="h" x="850" y="342" text-anchor="middle">refactor &lt;scope&gt;</text>
  <text class="b" x="850" y="366" text-anchor="middle">structure, not new behavior</text>
  <text class="b" x="850" y="386" text-anchor="middle">unpinned behavior plus</text>
  <text class="b" x="850" y="406" text-anchor="middle">approval gates</text>

  <rect class="box" x="1030" y="306" width="290" height="120" rx="12" fill="#f3f3f3" stroke="#8a8a8a"/>
  <text class="h" x="1175" y="342" text-anchor="middle">debug</text>
  <text class="b" x="1175" y="366" text-anchor="middle">read-only investigation</text>
  <text class="b" x="1175" y="386" text-anchor="middle">hypotheses stay unconfirmed</text>
  <text class="b" x="1175" y="406" text-anchor="middle">until observed</text>

  <text class="lane" x="40" y="470">3. Or drive the same run in discrete steps</text>

  <rect class="box" x="40" y="490" width="160" height="100" rx="24" fill="#e4ecff" stroke="#4262ff"/>
  <text class="h" x="120" y="530" text-anchor="middle">plan</text>
  <text class="b" x="120" y="554" text-anchor="middle">claims + checks</text>

  <rect class="box" x="240" y="490" width="210" height="100" rx="12" fill="#fff3d4" stroke="#f8a23a"/>
  <text class="h" x="345" y="526" text-anchor="middle">Human approval</text>
  <text class="b" x="345" y="548" text-anchor="middle">.paved/approvals/</text>
  <text class="b" x="345" y="566" text-anchor="middle">implementation-plan</text>

  <rect class="box" x="490" y="490" width="180" height="100" rx="24" fill="#e4ecff" stroke="#4262ff"/>
  <text class="h" x="580" y="530" text-anchor="middle">implement</text>
  <text class="b" x="580" y="554" text-anchor="middle">approved plan only</text>

  <rect class="box" x="710" y="490" width="170" height="100" rx="24" fill="#e8f4ff" stroke="#6ea8fe"/>
  <text class="h" x="795" y="526" text-anchor="middle">test</text>
  <text class="b" x="795" y="548" text-anchor="middle">one testing Tool</text>
  <text class="b" x="795" y="566" text-anchor="middle">not verify</text>

  <rect class="box" x="920" y="490" width="170" height="100" rx="24" fill="#e3f6e8" stroke="#3d9c4f"/>
  <text class="h" x="1005" y="526" text-anchor="middle">verify</text>
  <text class="b" x="1005" y="548" text-anchor="middle">profile checks</text>
  <text class="b" x="1005" y="566" text-anchor="middle">authoritative</text>

  <rect class="box" x="1130" y="490" width="190" height="100" rx="24" fill="#f3e8ff" stroke="#9b6ad6"/>
  <text class="h" x="1225" y="526" text-anchor="middle">review</text>
  <text class="b" x="1225" y="548" text-anchor="middle">findings and gaps</text>
  <text class="b" x="1225" y="566" text-anchor="middle">gaps are not a pass</text>

  <line x1="200" y1="540" x2="240" y2="540" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="540" x2="490" y2="540" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="540" x2="710" y2="540" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="540" x2="920" y2="540" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1090" y1="540" x2="1130" y2="540" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect class="box" x="40" y="614" width="1280" height="56" rx="10" fill="#ffffff" stroke="#b8b8b8"/>
  <text class="b" x="680" y="648" text-anchor="middle">feature / fix / refactor already walk these phases. plan, implement, review and debug share the same run. Implementation cannot advance without the plan approval record.</text>

  <text class="lane" x="40" y="710">4. After the change</text>

  <rect class="box" x="40" y="728" width="360" height="120" rx="12" fill="#e3f6e8" stroke="#3d9c4f"/>
  <text class="h" x="220" y="764" text-anchor="middle">Completion</text>
  <text class="b" x="220" y="790" text-anchor="middle">workflow evidence + matching</text>
  <text class="b" x="220" y="810" text-anchor="middle">check results + recorded diff</text>

  <rect class="box" x="430" y="728" width="380" height="120" rx="12" fill="#fff8d6" stroke="#e0c040"/>
  <text class="h" x="620" y="764" text-anchor="middle">gardener</text>
  <text class="b" x="620" y="790" text-anchor="middle">proposes stronger enforcement</text>
  <text class="b" x="620" y="810" text-anchor="middle">humans adopt; never auto-writes</text>
  <text class="b" x="620" y="830" text-anchor="middle">human-owned review</text>

  <rect class="box" x="840" y="728" width="480" height="120" rx="12" fill="#fde8e8" stroke="#e15a5a"/>
  <text class="h" x="1080" y="760" text-anchor="middle">Do not</text>
  <text class="b" x="1080" y="784" text-anchor="middle">treat review as verification, invent checks</text>
  <text class="b" x="1080" y="804" text-anchor="middle">or package scripts, skip evidence or gates,</text>
  <text class="b" x="1080" y="824" text-anchor="middle">or reset existing .paved/ with init</text>

  <text class="small" x="40" y="890">init never creates a verification profile by itself. test records incomplete evidence. verify is the gate. Conversational commands return decisions[]; resume the same command with the human answer.</text>
  <text class="small" x="40" y="912">Full mapping: docs/concepts/agent-commands.md</text>
</svg>
