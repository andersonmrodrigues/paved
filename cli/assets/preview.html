<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisão de documento · Paved</title>
  <link rel="stylesheet" href="/preview.css">
  <script src="/preview.js" defer></script>
</head>
<body>
  <header><div><strong>Paved</strong><span>Revisão de documento</span></div><span id="connection">Conectando…</span></header>
  <main>
    <section class="document-pane">
      <div class="document-header"><small id="filename"></small><span id="version"></span></div>
      <article id="document" aria-label="Documento para revisão"></article>
    </section>
    <aside>
      <div class="aside-header"><h2>Comentários</h2><span id="count"></span></div>
      <p class="hint">Selecione um trecho do documento para comentar. O agente receberá o comentário nesta revisão.</p>
      <section id="compose" hidden>
        <blockquote id="selection-quote"></blockquote>
        <label for="comment-body">Seu comentário</label>
        <textarea id="comment-body" rows="4" maxlength="10000" placeholder="O que precisa mudar?"></textarea>
        <div class="actions"><button id="cancel-comment" class="quiet">Cancelar</button><button id="send-comment">Comentar</button></div>
      </section>
      <div id="comments"></div>
      <section class="approval">
        <h2>Aprovação</h2>
        <p id="approval-state">Aguardando revisão.</p>
        <button id="approve">Aprovar esta versão</button>
      </section>
      <p id="message" role="status"></p>
    </aside>
  </main>
</body>
</html>
