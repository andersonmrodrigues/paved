apiVersion: paved/v1
kind: Tool
id: core.testing.run
version: 0.1.2
title: Run testing state
purpose: Run the project's tests through an environment-specific implementation;
  the exit code decides the outcome.
capability: testing-run
safety: safe-mutation
permissions:
  - process-control
environments:
  - local
  - ci
  - ephemeral
inputs: []
outputs:
  format: text
  description: The test runner's own output; exit code 0 means the tests passed.
side_effects:
  - process
  - filesystem
preconditions: []
idempotency: unknown
timeout_seconds: 3600
retry:
  max_attempts: 1
  backoff_seconds: 0
errors:
  - invalid-input
  - failed-precondition
  - permission-denied
  - timeout
  - execution-failure
  - implementation-unavailable
evidence:
  capture:
    - revision
    - environment
    - timestamps
    - output-digest
    - artifacts
availability: available
confirmation: none
examples:
  - description: Resolve this capability through a selected adapter or project
      implementation.
