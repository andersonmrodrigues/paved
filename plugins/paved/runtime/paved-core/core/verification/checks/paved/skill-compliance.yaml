apiVersion: paved/v1
kind: Check
id: core.paved.skill-compliance
title: Evidence satisfies its skills
purpose: >-
  The verification plan of an evidence record keeps every check type and evidence kind required by the skills named as its producers.
type: conformance
tool: core.paved.evidence
inputs:
  against: skills
preconditions:
  - id: cli-available
    condition: The Paved CLI is installed at a version compatible with the repository's manifest.
    when_unmet: blocked
expected:
  description: The assessment reports no finding for any producer skill.
  exit_code: 0
timeout_seconds: 120
environment:
  kinds: [local, ci]
failure: >-
  A skill requirement was dropped from the plan. Restore it and run the missing verification, or record a gap with its reason.
determinism:
  class: deterministic
retry:
  class: non-retryable
