apiVersion: paved/v1
kind: Generator
id: rules
version: 0.2.0
status: experimental
summary: >
  Proposes project rules from constraints the repository already enforces or states, and from recurring evidence of violations.
depends_on: [project-context/architecture]
inputs:
  - kind: repository
    description: Linter and analyzer configuration, architecture tests, contribution guides, decision records.
  - kind: evidence
    description: Evidence records with violated or overridden rules.
  - kind: project-context
    description: Declared architectural boundaries.
outputs:
  - path: .paved/generated/proposals/rules/
    format: yaml
    metadata: sidecar
    schema: Rule
change_detection:
  strategy: [source-hash, on-demand]
  watch:
    - "**/*"
