apiVersion: paved/v1
kind: Generator
id: project-context/domain
version: 0.2.0
status: experimental
summary: >
  Drafts a glossary of domain terms and the entities, relationships and invariants that the code makes explicit.
depends_on: [project-context/architecture]
inputs:
  - kind: repository
    description: Type and schema definitions, database migrations, validation code, API contracts, existing documentation.
  - kind: project-context
    description: Architecture context, to know where domain code lives.
outputs:
  - path: .paved/project/domain/
    format: markdown
    metadata: inline
    schema: ContextDocument
change_detection:
  strategy: [source-hash]
  watch:
    - "**/*"
