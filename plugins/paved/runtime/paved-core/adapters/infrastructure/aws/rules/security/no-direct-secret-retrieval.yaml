apiVersion: paved/v1
kind: Rule
id: adapter-aws.security.no-direct-secret-retrieval
title: Do not read AWS secret values into the session
rationale: >
  A secret value fetched by the agent lands in the transcript, tool output and possibly
  evidence records, where it outlives the task and reaches everyone who can read them.
applies_to: {}
rule: >
  Do not call Secrets Manager GetSecretValue or BatchGetSecretValue through the AWS CLI,
  an SDK, an MCP tool or the Secrets Manager Agent endpoint to see a secret's value, and
  do not print SSM SecureString parameters with decryption. Refer to secrets by name or
  ARN and let them resolve at runtime through the project's mechanism, such as
  CloudFormation dynamic references, ECS or Lambda secret injection, or a wrapper that
  injects the value into the child process environment. Application code that reads a
  secret at runtime is allowed; the agent running it to inspect the value is not.
enforcement:
  mechanism: agent
  layer: rule
severity: error
verification: >
  The agent reviews its own commands and the diff for direct secret reads and records the
  rule as satisfied; a reviewer confirms no secret value appears in the transcript or
  evidence.
overridable: false
