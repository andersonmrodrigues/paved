$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:paved:schema:change-review-bundle:v1
title: Paved independent change-review bundle
description: >-
  Independent reviewer evidence for the same approved plan, source and verification
  state. Each planned lens must be covered by an isolated reviewer with a distinct identity.
type: object
additionalProperties: false
required: [apiVersion, kind, reviewed, reviews]
properties:
  apiVersion: { const: paved/v1 }
  kind: { const: ChangeReviewBundle }
  run: { type: string, minLength: 1 }
  target:
    type: object
    additionalProperties: false
    required: [kind, ref, base, head, working_tree]
    properties:
      kind: { enum: [base, range] }
      ref: { type: string, minLength: 1, maxLength: 500 }
      base: { $ref: "#/$defs/commit" }
      head: { $ref: "#/$defs/commit" }
      working_tree: { type: boolean }
  reviewed:
    type: object
    additionalProperties: false
    properties:
      plan_sha256: { $ref: "#/$defs/sha256" }
      source_sha256: { $ref: "#/$defs/sha256" }
      evidence_sha256: { $ref: "#/$defs/sha256" }
      diff_sha256: { $ref: "#/$defs/sha256" }
  reviews:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [reviewer, passes, findings]
      properties:
        reviewer:
          type: object
          additionalProperties: false
          required: [agent, isolated, lens]
          properties:
            agent: { type: string, minLength: 1, maxLength: 200 }
            isolated: { type: boolean }
            lens: { enum: [Skeptic, Architect, Minimalist, Security, ThreatModel, Performance] }
        passes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { enum: [rules, diff, change] }
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [severity, file, summary]
            properties:
              severity: { enum: [blocking, note] }
              file: { type: string, minLength: 1 }
              line: { type: integer, minimum: 1 }
              summary: { type: string, minLength: 1, maxLength: 2000 }
              proof: { $ref: "urn:paved:schema:change-review:v1#/$defs/proof" }
              rule:
                $ref: "urn:paved:schema:common:v1#/$defs/ruleRef"
anyOf:
  - required: [target]
  - required: [run]
if: { required: [target] }
then:
  not: { required: [run] }
  properties:
    reviewed: { type: object, required: [diff_sha256] }
else:
  not: { required: [target] }
  properties:
    reviewed: { type: object, required: [plan_sha256, source_sha256, evidence_sha256] }
$defs:
  sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  commit: { type: string, pattern: '^[a-f0-9]{40}([a-f0-9]{24})?$' }
