$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:paved:schema:model-policy:v1
title: Paved model policy
description: Human-owned model preferences for host-reported delegation roles.
type: object
additionalProperties: false
required: [apiVersion, kind, roles]
properties:
  apiVersion: { const: paved/v1 }
  kind: { const: ModelPolicy }
  roles:
    type: object
    additionalProperties: false
    required: [explorer, implementer, reviewer, mechanical]
    properties:
      explorer: { $ref: "#/$defs/modelPreferences" }
      implementer: { $ref: "#/$defs/modelPreferences" }
      reviewer: { $ref: "#/$defs/modelPreferences" }
      mechanical: { $ref: "#/$defs/modelPreferences" }
$defs:
  modelPreferences:
    type: array
    minItems: 1
    maxItems: 20
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:/+-]*$"
