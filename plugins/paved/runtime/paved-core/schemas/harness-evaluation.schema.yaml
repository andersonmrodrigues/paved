$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:paved:schema:harness-evaluation:v1
title: Paved task-level harness evaluation
description: Paired baseline and candidate measurements for one fixed task and revision.
type: object
additionalProperties: false
required: [apiVersion, kind, id, repository_revision, host, host_version, acceptance_criteria, variants]
properties:
  apiVersion: { $ref: "urn:paved:schema:common:v1#/$defs/apiVersion" }
  kind: { const: HarnessEvaluation }
  id: { $ref: "urn:paved:schema:common:v1#/$defs/name" }
  repository_revision: { type: string, pattern: "^(?:[a-f0-9]{40}|[a-f0-9]{64})$" }
  host: { enum: [claude-code, codex] }
  host_version: { $ref: "urn:paved:schema:common:v1#/$defs/nonEmptyString" }
  acceptance_criteria:
    type: array
    minItems: 1
    uniqueItems: true
    items: { $ref: "urn:paved:schema:common:v1#/$defs/name" }
  variants:
    type: array
    minItems: 2
    maxItems: 3
    items: { $ref: "#/$defs/variant" }
allOf:
  - properties:
      variants:
        type: array
        contains: { type: object, properties: { role: { const: baseline } }, required: [role] }
        minContains: 1
        maxContains: 1
        items:
          allOf:
            - if: { type: object, properties: { role: { const: baseline } }, required: [role] }
              then: { type: object, properties: { changes: { type: array, maxItems: 0 } } }
            - if: { type: object, properties: { role: { const: candidate } }, required: [role] }
              then: { type: object, properties: { changes: { type: array, minItems: 1 } } }
$defs:
  variant:
    type: object
    additionalProperties: false
    required: [task_id, role, changes, measurements]
    properties:
      task_id: { $ref: "urn:paved:schema:common:v1#/$defs/name" }
      role: { enum: [baseline, candidate] }
      changes:
        type: array
        maxItems: 8
        items:
          type: object
          additionalProperties: false
          required: [id, target, rationale]
          properties:
            id: { $ref: "urn:paved:schema:common:v1#/$defs/name" }
            target: { enum: [prompt, guardrail, memory, tool-guidance, subagent, skill, script, plugin] }
            rationale: { $ref: "urn:paved:schema:common:v1#/$defs/nonEmptyString" }
      measurements:
        type: array
        minItems: 3
        items: { $ref: "#/$defs/measurement" }
  measurement:
    type: object
    additionalProperties: false
    required: [repetition, model, effort, checks, review, reviewer, evidence, input_tokens, output_tokens, duration_ms]
    properties:
      repetition: { type: integer, minimum: 1 }
      model:
        description: Concrete host-selected model. Keep identical across variants to isolate harness changes.
        $ref: "urn:paved:schema:common:v1#/$defs/nonEmptyString"
      effort:
        description: Host-selected reasoning effort. Keep identical across variants to isolate harness changes.
        $ref: "urn:paved:schema:common:v1#/$defs/nonEmptyString"
      checks:
        type: object
        minProperties: 1
        additionalProperties: { type: boolean }
      review: { enum: [accepted, changes-requested, unavailable] }
      reviewer: { $ref: "urn:paved:schema:common:v1#/$defs/nonEmptyString" }
      evidence: { $ref: "urn:paved:schema:common:v1#/$defs/relativePath" }
      input_tokens: { type: integer, minimum: 0 }
      output_tokens: { type: integer, minimum: 0 }
      cost_usd: { type: number, minimum: 0 }
      duration_ms: { type: integer, minimum: 0 }
