$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:paved:schema:delegation-evaluation:v1
title: Paved delegation evaluation dataset
description: Paired host-reported measurements comparing sequential and delegated execution of one fixed scenario.
type: object
additionalProperties: false
required: [schema_version, scenario_id, repository_revision, host, host_version, measurements]
properties:
  schema_version: { const: 1 }
  scenario_id: { $ref: "urn:paved:schema:common:v1#/$defs/name" }
  repository_revision:
    type: string
    pattern: "^(?:[a-f0-9]{40}|[a-f0-9]{64})$"
  host: { enum: [claude-code, codex] }
  host_version: { $ref: "urn:paved:schema:common:v1#/$defs/nonEmptyString" }
  measurements:
    type: array
    minItems: 6
    items: { $ref: "#/$defs/measurement" }
$defs:
  measurement:
    type: object
    additionalProperties: false
    required: [strategy, repetition, model, effort, success, acceptance_passed, acceptance_total, input_tokens, output_tokens, duration_ms, retries]
    properties:
      strategy: { enum: [sequential, delegated] }
      repetition: { type: integer, minimum: 1 }
      model: { $ref: "urn:paved:schema:common:v1#/$defs/nonEmptyString" }
      effort: { $ref: "urn:paved:schema:common:v1#/$defs/nonEmptyString" }
      success: { type: boolean }
      acceptance_passed: { type: integer, minimum: 0 }
      acceptance_total: { type: integer, minimum: 1 }
      input_tokens: { type: integer, minimum: 0 }
      output_tokens: { type: integer, minimum: 0 }
      reasoning_tokens: { type: integer, minimum: 0 }
      cost_usd: { type: number, minimum: 0 }
      duration_ms: { type: integer, minimum: 0 }
      retries: { type: integer, minimum: 0 }
      evidence: { type: string, minLength: 1 }
