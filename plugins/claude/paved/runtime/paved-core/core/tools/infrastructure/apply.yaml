apiVersion: paved/v1
kind: Tool
id: core.infrastructure.apply
version: 0.1.0
title: Apply infrastructure state
purpose: Provide the infrastructure apply capability through an
  environment-specific implementation with structured results.
capability: infrastructure-apply
safety: high-impact
permissions:
  - infrastructure-write
environments:
  - shared
  - production
inputs: []
outputs:
  format: json
  description: Structured observations and execution metadata for this capability.
  fields:
    - status
side_effects:
  - cloud-resource
preconditions: []
idempotency: unknown
timeout_seconds: 300
retry:
  max_attempts: 1
  backoff_seconds: 0
errors:
  - invalid-input
  - failed-precondition
  - permission-denied
  - timeout
  - execution-failure
  - implementation-unavailable
  - malformed-output
evidence:
  capture:
    - revision
    - environment
    - timestamps
    - output-digest
    - artifacts
availability: available
confirmation: required
examples:
  - description: Resolve this capability through a selected adapter or project
      implementation.
