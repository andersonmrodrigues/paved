$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:paved:schema:delegation-result:v1
title: Paved delegation result
description: A bounded subagent report. Validation establishes format, not correctness.
type: object
additionalProperties: false
required: [apiVersion, kind, findings, files_read, boundaries, non_obvious, questions]
properties:
  apiVersion: { const: paved/v1 }
  kind: { const: DelegationResult }
  findings: { $ref: "#/$defs/items" }
  files_read: { $ref: "#/$defs/items" }
  boundaries: { $ref: "#/$defs/items" }
  non_obvious: { $ref: "#/$defs/items" }
  questions: { $ref: "#/$defs/items" }
$defs:
  items:
    type: array
    maxItems: 100
    items: { type: string, minLength: 1, maxLength: 2000 }
