apiVersion: paved/v1
kind: ToolImplementation
id: adapter-github.change-request.merge
tool: core.change-request.merge
version: 0.2.0
contract: ^0.2.0
source: adapter
environments:
  - local
  - ci
invocation:
  type: command
  timeout_seconds: 120
  executable: node
  working_directory: .
  # A squash merge lands the reviewed patch as one commit, so its patch fingerprint on the
  # target equals the one recorded in the evidence. Paved enforces the patch-bound human
  # approval and delegates the final head check to GitHub.
  arguments:
    - .paved/runtime/bin/paved.mjs
    - delivery
    - merge
  input_bindings:
    - input: target
      flag: --base
    - input: change
      flag: --change
    - input: head
      flag: --head
availability: available
