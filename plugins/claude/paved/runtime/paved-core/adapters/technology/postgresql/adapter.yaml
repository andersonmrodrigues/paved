apiVersion: paved/v1
kind: Adapter
id: technology/postgresql
title: PostgreSQL
version: 0.1.0
summary: Repository-static evidence about PostgreSQL dependencies, configuration and migrations.
requires:
  core: ^1.0.0
detect:
  file_contains:
    - glob: pom.xml
      pattern: 'quarkus-jdbc-postgresql|<artifactId>postgresql</artifactId>'
    - glob: application.properties
      pattern: 'db-kind\s*=\s*postgresql|jdbc:postgresql:'
  confidence: strong
provides:
  capabilities:
    - id: database.configuration
      evidence:
        - glob: pom.xml
          pattern: 'quarkus-jdbc-postgresql|<artifactId>postgresql</artifactId>'
          statement: PostgreSQL driver dependency
        - glob: application.properties
          pattern: 'db-kind\s*=\s*postgresql|jdbc:postgresql:'
          statement: PostgreSQL datasource configuration key or protocol
    - id: database.migrations
      evidence:
        - glob: '**/*.sql'
          pattern: '\bCREATE\s+(?:TABLE|INDEX)\s+(?:IF\s+NOT\s+EXISTS\s+)?([a-zA-Z_][a-zA-Z0-9_.]*)'
          statement: SQL object creation statement
          capture: 1
sources:
  - title: PostgreSQL documentation
    url: https://www.postgresql.org/docs/
    retrieved_at: 2026-09-27
reviewed_at: 2026-09-27
