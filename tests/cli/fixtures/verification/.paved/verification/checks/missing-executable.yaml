apiVersion: paved/v1
kind: Check
id: project.verify.missing-executable
title: Missing executable verification
purpose: Report an environment launch failure.
type: unit
tool: project.tool.missing-executable
inputs:
  mode: pass
expected:
  description: The executable starts and exits successfully.
  exit_code: 0
timeout_seconds: 5
environment:
  kinds: [local]
failure: The executable is unavailable.
determinism:
  class: deterministic
retry:
  class: non-retryable
