apiVersion: paved/v1
kind: Workflow
id: project.sample
title: Sample
description: Sample workflow. Use when testing fixtures.
version: 1.2.0
status: deprecated
deprecation:
  since: 0.9.0
  migration: Use project.replacement instead; it adds a review phase.
  replaced_by: project.replacement
change_type: configuration
inputs:
  - id: request
    description: What to change.
    required: true
context:
  required: [manifest]
  optional: [rules]
preconditions:
  - id: clean-tree
    condition: The working tree is clean.
rules: [core.quality.evidence-before-completion]
phases:
  - phase: context
    goal: Restate the task.
    gates:
      - id: scope-clear
        condition: Scope is stated.
  - phase: discovery
    goal: Look around.
    skip_when: The task names the exact file to change.
    tools:
      required: [core.repository.status]
      optional: [core.repository.history]
  - phase: implementation
    goal: Change it.
    retry:
      class: requires-human
    gates:
      - id: risky
        when: The change touches shared configuration.
        condition: A human accepted the risk.
        approval: risk-acceptance
  - phase: verification
    goal: Prove it.
    verification:
      required: [unit]
      recommended: [integration]
    retry:
      class: retryable
      max_attempts: 3
  - phase: evidence
    goal: Record evidence.
  - phase: completion
    goal: Finish.
evidence:
  required: [check-result]
outputs: [change, evidence]
completion:
  criteria: [The change is applied.]
references: [references/checklist.md]
