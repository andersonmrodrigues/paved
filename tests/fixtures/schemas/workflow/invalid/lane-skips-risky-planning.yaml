# expect-error: /phases/1/skip_in_lanes must NOT be valid
apiVersion: paved/v1
kind: Workflow
id: project.sample
title: Sample
description: Sample workflow. Use when testing fixtures.
version: 0.1.0
status: experimental
change_type: configuration
inputs:
  - id: request
    description: What to change.
    required: true
phases:
  - phase: context
    goal: Restate the task.
    skip_in_lanes: [trivial]
  - phase: planning
    goal: Plan it.
    skip_in_lanes: [standard, risky]
  - phase: implementation
    goal: Change it.
    routing:
      mode: primary
      capacity: balanced
      reasoning_effort: medium
      rationale: The primary session owns the change.
    routing_by_lane:
      trivial: { capacity: economy, reasoning_effort: low, rationale: A trivial change needs no strong model. }
  - phase: verification
    goal: Prove it.
    verification:
      required: [unit]
  - phase: evidence
    goal: Record evidence.
  - phase: completion
    goal: Finish.
evidence:
  required: [check-result]
outputs: [change, evidence]
completion:
  criteria: [The change is applied.]
