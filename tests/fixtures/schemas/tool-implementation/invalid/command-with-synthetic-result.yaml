# expect-error: /invocation must NOT be valid
apiVersion: paved/v1
kind: ToolImplementation
id: core.git.status
tool: core.git.status
version: 0.1.0
contract: ^0.1.0
source: core
environments:
  - local
  - ci
  - ephemeral
invocation:
  type: command
  timeout_seconds: 30
  synthetic_result:
    status: ok
  executable: git
  arguments:
    - status
    - --porcelain=v1
availability: available
