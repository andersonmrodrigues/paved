# expect-problem: requires no evidence
# expect-problem: required check type build cannot prove anything
apiVersion: paved/v1
kind: Workflow
id: project.sample
title: Sample
description: >-
  Applies a configuration change and proves it. Use when a task changes project
  configuration only.
version: 0.1.0
status: experimental
change_type: configuration
inputs:
  - id: request
    description: The configuration to change.
    required: true
phases:
  - phase: context
    goal: Restate the change.
    skills: [core.discovery.context-discovery]
  - phase: implementation
    goal: Change the configuration.
  - phase: verification
    goal: Prove it.
    verification:
      required: [build]
  - phase: evidence
    goal: Record evidence.
  - phase: completion
    goal: Finish.
evidence:
  required: []
outputs: [change, evidence]
completion:
  criteria: [The configuration is applied.]
