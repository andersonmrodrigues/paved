apiVersion: paved/v1
kind: Tool
id: project.test.run-unit
title: Run unit tests
purpose: Run the unit suite.
safety: read-only
inputs: []
outputs:
  format: text
  description: Test report.
side_effects: []
confirmation: none
examples:
  - description: Run the suite.
version: 0.1.0
