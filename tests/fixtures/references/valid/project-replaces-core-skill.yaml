# A project disables a Core skill and adds its own with the same short name.
apiVersion: paved/v1
kind: Overrides
skills:
  - target: core.debugging.root-cause-analysis
    action: disable
    owner: sample-team
    reason: The project uses its own debugging procedure.
---
apiVersion: paved/v1
kind: Skill
version: 0.1.0
status: experimental
id: project.debugging.root-cause-analysis
category: debugging
context:
  required: [manifest]
tools:
  required: [core.repository.diff]
rules: [core.security.no-secrets-in-source]
verification:
  required: [unit]
evidence:
  required: [check-result]
---
apiVersion: paved/v1
kind: Workflow
id: project.sample
title: Sample
description: Sample bug workflow. Use when testing references.
version: 0.1.0
status: experimental
change_type: bug-fix
inputs:
  - id: report
    description: The defect.
    required: true
rules: [core.testing.regression-test-for-bug-fix]
phases:
  - phase: context
    goal: Locate the failure.
    skills: [project.debugging.root-cause-analysis]
    tools:
      required: [core.repository.history]
      optional: [project.git.absent]
  - phase: verification
    goal: Prove the fix.
    verification:
      required: [unit]
  - phase: evidence
    goal: Record evidence.
  - phase: completion
    goal: Finish.
evidence:
  required: [check-result]
outputs: [change, evidence]
completion:
  criteria: [The defect no longer occurs.]
