apiVersion: paved/v1
kind: Check
id: core.paved.workflow-completion
title: Evidence satisfies its workflow
purpose: >-
  The verification plan of an evidence record keeps every check type and evidence kind the producing workflow requires, and the completion recomputed from the observations matches what the record states.
type: conformance
tool: core.paved.evidence
inputs:
  against: workflow
preconditions:
  - id: cli-available
    condition: The Paved CLI is installed at a version compatible with the repository's manifest.
    when_unmet: blocked
expected:
  description: The assessment reports no blocking finding and the evaluated status equals the stated status.
  exit_code: 0
timeout_seconds: 120
environment:
  kinds: [local, ci]
failure: >-
  The record states more than its observations support, or its plan dropped a requirement. Finish the missing verification or report the task as incomplete.
determinism:
  class: deterministic
retry:
  class: non-retryable
