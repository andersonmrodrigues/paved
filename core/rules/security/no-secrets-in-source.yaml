apiVersion: paved/v1
kind: Rule
id: core.security.no-secrets-in-source
title: Never commit secrets
rationale: >
  Secrets in version control are exposed to everyone with read access and remain in
  history after deletion.
applies_to: {}
rule: >
  Do not add credentials, tokens, private keys or connection strings with embedded
  passwords to tracked files, including tests, fixtures, examples and evidence records.
  Reference secrets through the project's configured secret mechanism.
enforcement:
  mechanism: agent
  layer: rule
severity: error
verification: >
  A `security` check with secret scanning passes when the project has one; otherwise the
  agent reviews the diff for secrets and records the rule as satisfied.
overridable: false
