apiVersion: paved/v1
kind: Skill
id: core.debugging.bug-investigation
version: 0.3.1
status: experimental
category: debugging
context:
  required: []
  optional: [feature-map, verification]
tools:
  required: [core.repository.diff]
  optional: [core.repository.history]
rules:
  - core.testing.regression-test-for-bug-fix
