$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:paved:schema:agent-integration:v1
title: Paved agent integration package
description: Metadata for a thin projection from Paved Core into an agent-native skill/plugin format.
type: object
additionalProperties: false
required:
  - apiVersion
  - kind
  - id
  - version
  - target
  - supported_paved_api_versions
  - supported_core_range
  - capabilities
  - scope
  - provenance
properties:
  apiVersion: { $ref: "urn:paved:schema:common:v1#/$defs/apiVersion" }
  kind: { const: AgentIntegration }
  id:
    type: string
    pattern: "^paved\\.integration\\.[a-z0-9]+(?:-[a-z0-9]+)*$"
  version: { $ref: "urn:paved:schema:common:v1#/$defs/semver" }
  target:
    type: object
    additionalProperties: false
    required: [agent, version_range]
    properties:
      agent:
        type: string
        enum: [codex, claude-code]
      version_range:
        type: string
        minLength: 1
  supported_paved_api_versions:
    type: array
    minItems: 1
    uniqueItems: true
    items: { $ref: "urn:paved:schema:common:v1#/$defs/apiVersion" }
  supported_core_range:
    type: string
    minLength: 1
  capabilities:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [context, skills, workflows, tools, verification, status, diagnostics, lifecycle]
  scope:
    const: project
  provenance:
    type: object
    additionalProperties: false
    required: [owner, generated]
    properties:
      owner: { const: paved }
      generated: { const: true }
