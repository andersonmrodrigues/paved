$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:paved:schema:capability-registry:v1
title: Paved capability registry
description: Technology-neutral meanings and concrete consumers of Paved capabilities.
type: object
additionalProperties: false
required: [apiVersion, kind, capabilities]
properties:
  apiVersion: { $ref: "urn:paved:schema:common:v1#/$defs/apiVersion" }
  kind: { const: CapabilityRegistry }
  capabilities:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, meaning, consumer]
      properties:
        id: { type: string, pattern: "^[a-z]+\\.[a-z][a-z0-9.-]*$" }
        meaning: { $ref: "urn:paved:schema:common:v1#/$defs/nonEmptyString" }
        consumer: { $ref: "urn:paved:schema:common:v1#/$defs/nonEmptyString" }
        tool_capability:
          description: Existing Tool capability string when this meaning is executable through a Tool.
          $ref: "urn:paved:schema:common:v1#/$defs/nonEmptyString"
